services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres_workspace
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: workspace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: America/Bogota
    
    ports:
      - "5433:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workspace_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - workspace_network

volumes:
  postgres_data:
    name: workspace_postgres_data

networks:
  workspace_network:
    name: workspace_network